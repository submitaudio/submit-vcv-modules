  <text x="210" y="13" text-anchor="middle"
        font-family="Georgia, serif" font-size="15" font-weight="bold" font-style="italic"
        fill="#ffd700" letter-spacing="2">twiN</text>

  <!-- Screws -->
  <circle cx="10" cy="10" r="5" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>
  <circle cx="410" cy="10" r="5" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>
  <circle cx="10" cy="370" r="5" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>
  <circle cx="410" cy="370" r="5" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>

