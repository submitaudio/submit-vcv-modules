  <text x="12" y="190" font-family="Arial,sans-serif" font-size="7" fill="#ffd700" font-weight="bold" letter-spacing="1">HEAD 1</text>
  <line x1="52" y1="187" x2="200" y2="187" stroke="#ffd700" stroke-width="0.5" opacity="0.6"/>

  <!-- HEAD 1 knob labels -->
  <text x="68" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">POS</text>
  <text x="136" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">SPEED</text>
  <text x="204" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">PITCH</text>
  <text x="272" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">VOL</text>

