  <text x="68" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">POS</text>
  <text x="136" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">SPEED</text>
  <text x="204" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">PITCH</text>
  <text x="272" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">VOL</text>

