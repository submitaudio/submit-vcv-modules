  <text x="362" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">SCAN</text>
  <text x="430" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#aaa">SIZE</text>
