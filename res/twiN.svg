<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380">

  <!-- Achtergrond -->
  <rect x="0" y="0" width="420" height="380" fill="#1a1a1a"/>

  <!-- I/O zone onderaan -->
  <rect x="0" y="338" width="420" height="42" fill="#141414"/>
  <line x1="0" y1="338" x2="420" y2="338" stroke="#ffd700" stroke-width="0.8"/>

  <!-- Golvende lijnen header -->
  <path d="M-5 22 Q30 14 60 22 Q90 30 120 22 Q150 14 180 22 Q210 30 240 22 Q270 14 300 22 Q330 30 360 22 Q390 14 420 22"
        fill="none" stroke="#ffd700" stroke-width="1.2" opacity="0.9"/>
  <path d="M-5 27 Q30 19 60 27 Q90 35 120 27 Q150 19 180 27 Q210 35 240 27 Q270 19 300 27 Q330 35 360 27 Q390 19 420 27"
        fill="none" stroke="#ffd700" stroke-width="0.6" opacity="0.5"/>

