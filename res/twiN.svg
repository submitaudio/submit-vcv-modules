  <text x="204" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#ffffff">H2 L</text>
  <text x="249" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#ffffff">H2 R</text>
  <text x="408" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#ffd700">OUT L</text>
  <text x="453" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#ffd700">OUT R</text>

