name: Build Drift beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RACK_SDK_VERSION: "2.5.0"

jobs:
  build-win-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux:2.5.0
      options: --user root
    strategy:
      matrix:
        include:
          - target: win-x64
          - target: lin-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Drift
        shell: bash
        run: |
          cd drift
          echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          make -j$(nproc)

      - name: Upload Drift artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.target }}
          path: drift/dist
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: mac-x64
          - target: mac-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Rack SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o Rack-SDK.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac.zip"
          mkdir -p deps
          unzip -q Rack-SDK.zip -d deps

      - name: Build Drift
        shell: bash
        run: |
          cd drift
          export RACK_SDK_PATH=$PWD/../deps/Rack-SDK
          echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV

          if command -v sysctl >/dev/null; then
            CORES=$(sysctl -n hw.logicalcpu)
          else
            CORES=2
          fi

          make -j${CORES}

      - name: Upload Drift artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.target }}
          path: drift/dist
          if-no-files-found: error
