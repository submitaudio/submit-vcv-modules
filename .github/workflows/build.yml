name: Build VCV Rack Plugin

on:
  push:
  create:
    tags:
      - 'v*'

env:
  rack-sdk-version: latest
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:

  build:
    name: ${{ matrix.platform }}
    if: ${{ !startsWith(github.ref, 'refs/tags/submitlab-v') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.rack-plugin-toolchain-dir }}/plugin-build
          name: ${{ matrix.platform }}

  build-mac:
    name: mac-arm64
    if: ${{ !startsWith(github.ref, 'refs/tags/submitlab-v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack-SDK
        run: |
          pushd $HOME
          wget -O Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-2.6.6-mac-arm64.zip
          unzip -o Rack-SDK.zip
      - name: Build plugin
        run: |
          export RACK_DIR=$HOME/Rack-SDK
          make dep
          make dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.vcvplugin
          name: mac-arm64

  release:
    name: Create Release
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.vcvplugin
          name: Submit ${{ github.ref_name }}
          draft: true
          body: |
            ## Submit Audio VCV Rack Plugin ${{ github.ref_name }}
            
            ### Modules
            - Drift — All-in-one voice module
            - Chrono — Tape delay
            - Impact — Kick drum synthesizer
            - Chain — Stereo channel mixer
            - Sum M4 — Compact four-channel mono Chain mixer
            - Sum S4 — Compact four-channel stereo Chain mixer
            - Set — Clocked performance timer and pulse utility
            - Pulse — Trigger and final-mix visual monitor
            - Tag — Editable patch-section label
            - Squeeze — Sidechain envelope generator
            - Shape — 6-band SSL-style EQ
            - Master — Master bus processor
            - Gain — Line level booster
            - Sweep — Filter
            - Loop — Sample loop player
            - Clang — Techno percussion synthesizer
            - React — Four-voice rhythm sequencer
            - Sync — Compact 1 PPQN clock
            - Flip — Clock-synchronised stereo reverse effect
            - Orbit — Rhythmic relationship processor
            - Circles - Circular eight-step sequencer
            - SUB - Monophonic bass voice with octave-down sub layer
            
            ### Download
            Choose the version for your platform:
            - `mac-arm64` — Apple Silicon (M1/M2/M3/M4)
            - `win-x64` — Windows
            - `lin-x64` — Linux
            
            ### Links
            [See Manual](https://github.com/submitaudio/submit-vcv-modules/blob/master/MANUAL.md)
            [See CHANGELOG.md for details](https://github.com/submitaudio/submit-vcv-modules/blob/master/CHANGELOG.md)
            [Visit submitaudio.nl](https://submitaudio.nl)
            [Licensed under GPL-3.0](https://github.com/submitaudio/submit-vcv-modules/blob/master/LICENSE)
