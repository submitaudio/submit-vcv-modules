name: Build VCV Rack Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            zip
            unzip
            wget

      - name: Download Rack SDK
        shell: msys2 {0}
        run: |
          wget -q https://vcvrack.com/downloads/Rack-SDK-2.6.6-win-x64.zip -O Rack-SDK.zip
          unzip -q Rack-SDK.zip
          mv Rack-SDK-2* Rack-SDK

      - name: Build plugin
        shell: msys2 {0}
        run: |
          export RACK_DIR=$(pwd)/Rack-SDK
          make -j4

      - name: Package plugin
        shell: msys2 {0}
        run: |
          export RACK_DIR=$(pwd)/Rack-SDK
          make install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submit-windows
          path: dist/*.vcvplugin
