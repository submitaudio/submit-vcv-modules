name: Build VCV Rack Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vcvrack/rack-plugin-toolchain-win:2
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          export RACK_DIR=/usr/local/share/Rack-SDK
          make -j$(nproc) dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submit-windows
          path: dist/*.vcvplugin

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Rack SDK
        run: |
          wget -q https://vcvrack.com/downloads/Rack-SDK-2.6.6-mac-arm64.zip -O Rack-SDK.zip
          unzip -q Rack-SDK.zip
          mv Rack-SDK-* Rack-SDK || true

      - name: Build and package plugin
        run: |
          export RACK_DIR=$(pwd)/Rack-SDK
          make -j4
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submit-mac-arm64
          path: dist/*.vcvplugin
