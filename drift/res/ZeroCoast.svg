<?xml version="1.0" encoding="UTF-8"?>
<!-- ZeroCoast.svg — Placeholder VCV Rack panel (32HP = 487.68 x 380 px) -->
<!-- Replace with your custom Inkscape/Illustrator design -->
<svg width="487.68" height="380" viewBox="0 0 487.68 380"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Dark background -->
  <rect width="487.68" height="330" fill="#1a1a2e"/>

  <!-- White I/O area -->
  <rect y="330" width="487.68" height="50" fill="#ffffff"/>

  <!-- Section dividers -->
  <line x1="100" y1="20" x2="100" y2="325" stroke="#333355" stroke-width="1"/>
  <line x1="190" y1="20" x2="190" y2="325" stroke="#333355" stroke-width="1"/>
  <line x1="290" y1="20" x2="290" y2="325" stroke="#333355" stroke-width="1"/>
  <line x1="390" y1="20" x2="390" y2="325" stroke="#333355" stroke-width="1"/>

  <!-- Module title -->
  <text x="243.84" y="13" text-anchor="middle"
        font-family="sans-serif" font-size="14" font-weight="bold"
        fill="#FFC800">0-COAST</text>
  <text x="243.84" y="23" text-anchor="middle"
        font-family="sans-serif" font-size="8"
        fill="#FFC800">MADZINE</text>

  <!-- Section titles -->
  <text x="50"  y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFC800">OSCILLATOR</text>
  <text x="140" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFC800">MULTIPLY</text>
  <text x="230" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFC800">CONTOUR</text>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="7"  font-weight="bold" fill="#FFC800">OVERTONE / DYNAMICS</text>
  <text x="435" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFC800">BALANCE</text>

  <!-- Rack screws (top) -->
  <circle cx="7.5"   cy="7.5"  r="4" fill="#555566"/>
  <circle cx="480"   cy="7.5"  r="4" fill="#555566"/>
  <!-- Rack screws (bottom) -->
  <circle cx="7.5"   cy="372.5" r="4" fill="#555566"/>
  <circle cx="480"   cy="372.5" r="4" fill="#555566"/>

  <!-- Placeholder note -->
  <text x="243.84" y="180" text-anchor="middle"
        font-family="sans-serif" font-size="9"
        fill="#444466">[ prototype panel — design your own SVG ]</text>
</svg>
